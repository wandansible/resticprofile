---
- name: "Install restic"
  ansible.builtin.include_tasks:
    file: install-restic.yml
  when: resticprofile_restic_install | bool

- name: "Install resticprofile"
  ansible.builtin.include_tasks:
    file: install.yml
  when: resticprofile_install | bool

- name: "Configure resticprofile"
  ansible.builtin.include_tasks:
    file: configure.yml
