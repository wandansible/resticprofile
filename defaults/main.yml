---
resticprofile_arch_map:
  x86_64: amd64
  i386: 386
  aarch64: arm64
  armv7l: armv7
  armv6l: armv6

resticprofile_github_org: creativeprojects
resticprofile_github_repo: resticprofile
resticprofile_github_token: ""
resticprofile_archive_extension: "tar.gz"
resticprofile_checksum_filename: checksums.txt
resticprofile_checksum_type: sha256

resticprofile_version: latest

resticprofile_install: true
resticprofile_bin_dir: /opt/resticprofile
resticprofile_src_dir: /opt/resticprofile/src
resticprofile_strip_components: 0
resticprofile_src_files:
  - resticprofile
resticprofile_clean_src_dir: true
resticprofile_cli_tools:
  - resticprofile

resticprofile_update_time: "daily"
resticprofile_update_randomized_delay: "6h"

resticprofile_config_dir: /etc/resticprofile
resticprofile_config_file: profiles.yml
resticprofile_config: ""

resticprofile_template_dir: "{{ resticprofile_config_dir }}/templates"
resticprofile_template_files: []

resticprofile_restic_arch_map:
  x86_64: amd64
  i386: 386
  aarch64: arm64
  armv7l: arm
  armv6l: arm

resticprofile_restic_github_org: restic
resticprofile_restic_github_repo: restic
resticprofile_restic_archive_extension: "bz2"
resticprofile_restic_checksum_filename: SHA256SUMS
resticprofile_restic_checksum_type: sha256
resticprofile_restic_signature_filename: SHA256SUMS.asc
resticprofile_restic_gpg_keyserver: "hkps://keyserver.ubuntu.com"

resticprofile_restic_version: latest

resticprofile_restic_install: true
resticprofile_restic_bin_dir: /opt/restic
resticprofile_restic_src_dir: /opt/restic/src
resticprofile_restic_strip_components: 1
resticprofile_restic_src_files:
  - restic
resticprofile_restic_clean_src_dir: true
resticprofile_restic_cli_tools:
  - restic

resticprofile_restic_update_time: "daily"
resticprofile_restic_update_randomized_delay: "6h"

resticprofile_restic_config_dir: "{{ resticprofile_config_dir }}/restic"
resticprofile_restic_config_files: []
